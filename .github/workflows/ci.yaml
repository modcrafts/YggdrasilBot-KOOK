name: CI

# Images published to GHCR (ghcr.io/<owner>/yggdrasil-*):
#   - Push to main: always builds bot (:main, :latest, :sha-*), and automatically rebuilds
#     sandbox / render / browser (:latest) whenever their own source paths change.
#   - Release tags (vX.Y.Z, sandbox-vX.Y.Z, render-vX.Y.Z, browser-vX.Y.Z): builds the
#     corresponding image with both :vX.Y.Z and :latest.
#   - Manual workflow_dispatch: selectable per-image checkboxes (default: all four).
on:
  push:
    branches: [main]
    tags: ["v*", "sandbox-v*", "render-v*", "browser-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bot:
        description: "Build and push bot image"
        type: boolean
        default: true
      sandbox:
        description: "Build and push sandbox image"
        type: boolean
        default: true
      render:
        description: "Build and push render image"
        type: boolean
        default: true
      browser:
        description: "Build and push browser image"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/yggdrasil-bot
  SANDBOX_IMAGE: ghcr.io/${{ github.repository_owner }}/yggdrasil-sandbox
  RENDER_IMAGE: ghcr.io/${{ github.repository_owner }}/yggdrasil-render
  BROWSER_IMAGE: ghcr.io/${{ github.repository_owner }}/yggdrasil-browser

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Redis is an in-process fake in the tests (tests/conftest.py); only Postgres runs as a service.
    services:
      postgres:
        image: paradedb/paradedb:0.26.0-pg18
        env:
          POSTGRES_USER: ygg
          POSTGRES_PASSWORD: ygg
          POSTGRES_DB: ygg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ygg" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run basedpyright
      - name: Tests
        env:
          YGG_TEST_DB: "1"  # run the database tests against the service above
        run: |
          export YGG_SECRET_KEY="$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          uv run alembic upgrade head
          uv run pytest -q -rs --durations=15

  # Dashboard (web/): the generated API client matches web/openapi.json (which the check job's tests hold to the
  # admin API), and the app type-checks and builds.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated client is up to date
        run: |
          npm run gen
          git add --intent-to-add src/client
          git diff --exit-code src/client
      - run: npm run build

  # Decide which container images to build & publish for this event (runs on pushes and manual runs, not PRs).
  changes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      bot: ${{ steps.detect.outputs.bot }}
      sandbox: ${{ steps.detect.outputs.sandbox }}
      render: ${{ steps.detect.outputs.render }}
      browser: ${{ steps.detect.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref_type == 'branch'
        with:
          fetch-depth: 0
      - name: Detect images to build
        id: detect
        shell: bash
        run: |
          bot=false
          sandbox=false
          render=false
          browser=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bot="${{ inputs.bot }}"
            sandbox="${{ inputs.sandbox }}"
            render="${{ inputs.render }}"
            browser="${{ inputs.browser }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            case "${{ github.ref_name }}" in
              v*) bot=true ;;
              sandbox-v*) sandbox=true ;;
              render-v*) render=true ;;
              browser-v*) browser=true ;;
            esac
          else
            bot=true
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
            else
              changed="$(git diff --name-only "$before" "${{ github.sha }}")"
            fi
            echo "Changed files:"
            printf '%s\n' "$changed"
            if printf '%s\n' "$changed" | grep -Eq '^sandbox/'; then
              sandbox=true
            fi
            if printf '%s\n' "$changed" | grep -Eq '^render/'; then
              render=true
            fi
            if printf '%s\n' "$changed" | grep -Eq '^(browser/|yggdrasil/browser/|yggdrasil/tools/(ssrf|errors)\.py$)'; then
              browser=true
            fi
          fi

          {
            echo "bot=$bot"
            echo "sandbox=$sandbox"
            echo "render=$render"
            echo "browser=$browser"
          } >> "$GITHUB_OUTPUT"

  bot:
    needs: [check, web, changes]
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # vX.Y.Z is what argocd-image-updater deploys; latest/main/sha-* are for Docker Compose & manual pins.
          tags: |
            type=semver,pattern=v{{version}}
            type=sha,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # vX.Y.Z on tags, otherwise the branch/sha tag; lands in telemetry service.version.
          build-args: YGG_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

  # Sandbox workspace image (sandbox/): builds on sandbox/ changes to main, sandbox-vX.Y.Z tags, or manual runs.
  # The tests that need a real sandboxd (in-sandbox helpers, backend conformance) run here against this commit's image.
  sandbox:
    needs: [check, changes]
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - uses: docker/setup-buildx-action@v3
      # Target `sandboxd-test`: sandboxd, Python + ipykernel and the /opt/ygg helpers.
      - name: Build sandbox test image
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          file: sandbox/Dockerfile
          target: sandboxd-test
          load: true
          tags: ygg-sbx-test:ci
          cache-from: type=gha,scope=sandboxd-test
          cache-to: type=gha,mode=max,scope=sandboxd-test
      - name: Test against sandboxd
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          digest="$(printf '%s' "$token" | sha256sum | cut -d' ' -f1)"
          docker run -d --name ygg-sbx-test -p 127.0.0.1:18080:8080 -p 127.0.0.1:19090:9090 \
            ygg-sbx-test:ci --root-dir=/workspace "--auth-token-sha256=$digest"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/v1/health && break
            sleep 1
          done
          export YGG_TEST_SANDBOXD_REST=http://127.0.0.1:18080 YGG_TEST_SANDBOXD_GRPC=127.0.0.1:19090
          export YGG_TEST_SANDBOXD_TOKEN="$token"
          export YGG_SECRET_KEY="$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          uv run pytest -q tests/sandbox/test_helpers_*.py tests/sandbox/test_sandbox_conformance.py
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SANDBOX_IMAGE }}
          tags: |
            type=match,pattern=^sandbox-(v\d+\.\d+\.\d+)$,group=1
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          file: sandbox/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox

  # Render service image (render/): builds on render/ changes to main, render-vX.Y.Z tags, or manual runs.
  render:
    needs: [check, changes]
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.RENDER_IMAGE }}
          tags: |
            type=match,pattern=^render-(v\d+\.\d+\.\d+)$,group=1
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: render
          file: render/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=render
          cache-to: type=gha,mode=max,scope=render

  # Browser service image (browser/): builds on browser/ or yggdrasil/browser/ changes to main, browser-vX.Y.Z tags,
  # or manual runs. Built from the repository root: it copies yggdrasil/browser and the SSRF guard.
  browser:
    needs: [check, changes]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BROWSER_IMAGE }}
          tags: |
            type=match,pattern=^browser-(v\d+\.\d+\.\d+)$,group=1
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: browser/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=browser
          cache-to: type=gha,mode=max,scope=browser
